<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmarès – BO Escrime</title>
<style>
:root{--bordeaux:#7a1236;--rose:#c81d5c;--bg:#f6f3f4;--txt:#222;--muted:#6b6b6b;--line:#e8e1e4}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:var(--txt);background:#fff}
.wrap{max-width:1200px;margin:auto;padding:24px 16px 80px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.logo{height:64px;width:auto}
.top h1{margin:0;color:var(--bordeaux);font-size:30px}
.sub{margin:2px 0 0;color:var(--muted);font-size:15px}
.admin{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--bordeaux);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:bold;cursor:pointer}
.btn:hover{background:var(--rose)}
.btn.ghost{background:#fff;color:var(--bordeaux);border:2px solid var(--bordeaux)}
.btn.ghost:hover{background:var(--bg)}
.btn.small{padding:6px 10px;font-size:14px}
.card{background:#fff;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.12);padding:16px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin-bottom:20px}
.filters label{display:block;font-size:12px;font-weight:bold;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
select,input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
select:focus,input:focus{outline:2px solid var(--rose);border-color:var(--rose)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:28px;color:var(--bordeaux)}
.kpi span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{flex:1;min-width:140px;padding:12px;border:2px solid var(--bordeaux);background:#fff;color:var(--bordeaux);font-weight:bold;font-size:15px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--bordeaux);color:#fff}
table{width:100%;border-collapse:collapse}
th{background:var(--bordeaux);color:#fff;text-align:left;padding:10px;font-size:14px;white-space:nowrap}
th.s{cursor:pointer}
th.s:hover{background:var(--rose)}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
tr.yr td{background:var(--bg);color:var(--bordeaux);font-weight:bold;font-size:17px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;color:var(--bordeaux);font-weight:bold;font-size:15px}
.nm{font-weight:bold}
.tag{display:inline-block;font-size:12px;border-radius:20px;padding:2px 9px;background:var(--bg);color:var(--bordeaux);margin-right:4px}
.mem{display:block;font-size:12px;color:var(--muted)}
.place{font-weight:bold;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.pc{text-align:center;cursor:pointer;transition:transform .15s}
.pc:hover{transform:translateY(-3px)}
.pc .big{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--bordeaux);font-size:34px;font-weight:bold}
.pc h3{margin:6px 0;color:var(--bordeaux)}
.med{font-size:20px;margin:8px 0}
.small{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:16px}
.num{text-align:center}
tfoot td{font-weight:bold;background:var(--bg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:50}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:15px;padding:20px;width:100%;max-width:560px;margin:auto}
.mbox h2{margin:0 0 14px;color:var(--bordeaux)}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;font-weight:bold;color:var(--muted);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--bordeaux);border-radius:10px;padding:10px;cursor:pointer;color:var(--bordeaux);font-weight:bold;margin:0}
.seg input{width:auto}
.seg label.on{background:var(--bordeaux);color:#fff}
.pprev{display:flex;align-items:center;gap:12px}
.pprev img{width:70px;height:70px;border-radius:50%;object-fit:cover}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bordeaux);color:#fff;padding:12px 20px;border-radius:10px;display:none;z-index:99;font-size:15px}
@media(max-width:700px){
  .top h1{font-size:24px}.logo{height:50px}.admin{margin-left:0;width:100%}.admin .btn{flex:1}
  .row2{grid-template-columns:1fr}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 4px}
  table.stack tr.yr{border:0;padding:0;margin:14px 0 6px}
  table.stack td{border:0;display:flex;justify-content:space-between;gap:10px;padding:4px 10px;text-align:right}
  table.stack td::before{content:attr(data-label);color:var(--muted);font-size:13px;text-align:left}
  table.stack td.main{justify-content:flex-start;align-items:center;text-align:left;gap:12px}
  table.stack td.main::before{content:none}
  table.stack tr.yr td{display:block;text-align:left}
  table.stack tr.yr td::before{content:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <img class="logo" src="https://assets.zyrosite.com/TwBwKXLriE0GFu9P/logosmall-BerhlkgaFJDlPwO1.png" alt="BO Escrime">
    <div>
      <h1>Palmarès</h1>
      <p class="sub">Résultats des tireurs et des équipes – épée et sabre</p>
    </div>
    <div class="admin">
      <button id="btnAdd" class="btn" hidden>+ Ajouter un résultat</button>
      <button id="btnEdit" class="btn ghost">🔒 Mode édition</button>
    </div>
  </header>

  <section class="card filters">
    <div><label for="fArme">Arme</label><select id="fArme"></select></div>
    <div><label for="fAnnee">Année</label><select id="fAnnee"></select></div>
    <div><label for="fNiveau">Niveau</label><select id="fNiveau"></select></div>
    <div><label for="fSujet">Tireur / équipe</label><select id="fSujet"></select></div>
    <div><label for="fTri">Trier par</label>
      <select id="fTri">
        <option value="date:-1">Date (récent d'abord)</option>
        <option value="date:1">Date (ancien d'abord)</option>
        <option value="place:1">Place (meilleure d'abord)</option>
        <option value="niveau:-1">Niveau (le plus haut d'abord)</option>
        <option value="nom:1">Tireur / équipe (A → Z)</option>
        <option value="arme:1">Arme</option>
      </select>
    </div>
    <div><button id="fReset" class="btn ghost" style="width:100%">Réinitialiser</button></div>
  </section>

  <section id="kpis" class="kpis"></section>

  <nav class="tabs">
    <button data-tab="detail" class="on">📋 Détail des résultats</button>
    <button data-tab="tireurs">👤 Par tireur / équipe</button>
    <button data-tab="club">🏆 Récap du club</button>
  </nav>

  <section id="view"></section>
</div>

<!-- Formulaire d'ajout / modification -->
<div id="modal" class="modal" hidden>
  <form id="form" class="mbox">
    <h2 id="mTitle">Ajouter un résultat</h2>

    <div class="fg">
      <div class="seg" id="segType">
        <label class="on"><input type="radio" name="type" value="individuel" checked> 👤 Individuel</label>
        <label><input type="radio" name="type" value="equipe"> 👥 Équipe</label>
      </div>
    </div>

    <div class="fg">
      <label id="lblNom" for="mNom">Nom du tireur / de la tireuse</label>
      <input id="mNom" list="dlNoms" autocomplete="off" required>
      <datalist id="dlNoms"></datalist>
    </div>

    <div class="fg" id="gMembres" hidden>
      <label for="mMembres">Composition de l'équipe (facultatif)</label>
      <input id="mMembres" placeholder="ex. Prénom NOM, Prénom NOM, …">
    </div>

    <div class="row2">
      <div class="fg"><label for="mSexe">Sexe</label><select id="mSexe"></select></div>
      <div class="fg"><label for="mArme">Arme</label><select id="mArme"></select></div>
    </div>

    <div class="row2">
      <div class="fg"><label for="mDate">Date</label><input type="date" id="mDate" required></div>
      <div class="fg"><label for="mPlace">Place obtenue</label><input type="number" id="mPlace" min="1" inputmode="numeric" placeholder="1 = or, 2 = argent…" required></div>
    </div>

    <div class="fg"><label for="mComp">Titre de la compétition</label><input id="mComp" required placeholder="ex. Championnats de France Maîtres d'Armes"></div>

    <div class="row2">
      <div class="fg"><label for="mLieu">Lieu</label><input id="mLieu" required placeholder="ex. Toulouse"></div>
      <div class="fg"><label for="mNiveau">Niveau</label><select id="mNiveau"></select></div>
    </div>

    <div class="fg"><label for="mCat">Catégorie (facultatif)</label><input id="mCat" placeholder="ex. M13, M17, Senior, V1…"></div>

    <div class="fg">
      <label>Photo (facultatif)</label>
      <div class="pprev">
        <img id="mPrev" alt="" hidden>
        <div>
          <input type="file" id="mFile" accept="image/*">
          <div class="small" id="mFileMsg">Si aucune photo n'est ajoutée, la photo déjà enregistrée pour ce nom est reprise.</div>
          <button type="button" id="mRmPhoto" class="btn ghost small" hidden style="margin-top:6px">Retirer la photo</button>
        </div>
      </div>
    </div>

    <div class="acts">
      <button type="button" id="mCancel" class="btn ghost">Annuler</button>
      <button type="submit" id="mSave" class="btn">Enregistrer</button>
    </div>
  </form>
</div>
<div id="toast"></div>

<script>
const FB = 'https://bo-escrime-default-rtdb.europe-west1.firebasedatabase.app/palmares';
const CLOUD = 'du0nsof86', PRESET = 'bo_escrime_gallery';
const EDIT_CODE = 'Palmares';           // code du mode édition (à modifier ici si besoin)
const NIVEAUX = ['Départemental', 'Régional', 'National', 'International'];
const ARMES = ['Épée', 'Sabre'];
const SEXES = ['Femme', 'Homme', 'Mixte'];
const SEXE_PL = { Femme: 'Femmes', Homme: 'Hommes', Mixte: 'Mixte' };

const S = {
  data: [], tab: 'detail', edit: false, editId: null, photo: '',
  f: { arme: '', annee: '', niveau: '', sujet: '' },
  sort: { key: 'date', dir: -1 }
};
const $ = id => document.getElementById(id);

/* ---------- utilitaires ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');
const kOf = r => r.type + '|' + norm(r.nom);
const fmtDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('fr-FR') : '';
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const thumb = (u, w, h) => (u && u.includes('res.cloudinary.com') && u.includes('/upload/'))
  ? u.replace('/upload/', `/upload/c_fill,g_face,w_${w},h_${h}/`) : u;
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2800); }
function placeLabel(p) {
  p = Number(p);
  if (p === 1) return '🥇 1er';
  if (p === 2) return '🥈 2e';
  if (p === 3) return '🥉 3e';
  return p + 'e';
}
function photoFor(key) {
  const rows = S.data.filter(r => kOf(r) === key && r.photo).sort((a, b) => b.date.localeCompare(a.date));
  return rows.length ? rows[0].photo : '';
}
function avatar(r, cls = 'av', size = 44) {
  const p = photoFor(kOf(r));
  return p ? `<img class="${cls}" src="${esc(thumb(p, size * 2, size * 2))}" alt="${esc(r.nom)}" loading="lazy">`
           : `<span class="${cls}">${esc(initials(r.nom))}</span>`;
}

/* ---------- Firebase (REST) ---------- */
async function fb(method, path = '', body) {
  const r = await fetch(FB + path + '.json', {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function load() {
  try {
    const o = (await fb('GET')) || {};
    S.data = Object.entries(o).map(([id, v]) => ({ ...v, id }));
  } catch (e) {
    $('view').innerHTML = '<div class="empty">⚠️ Impossible de charger les résultats. Vérifiez la connexion puis rechargez la page.</div>';
    return;
  }
  buildFilters();
  render();
}

/* ---------- filtres ---------- */
function buildFilters() {
  const years = [...new Set(S.data.map(r => r.date.slice(0, 4)))].sort().reverse();
  const subjects = new Map();
  S.data.forEach(r => { const k = kOf(r); if (!subjects.has(k)) subjects.set(k, r); });
  const subj = [...subjects.entries()].sort((a, b) => a[1].nom.localeCompare(b[1].nom, 'fr'));
  const fill = (id, first, opts, cur) => {
    $(id).innerHTML = `<option value="">${first}</option>` + opts.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('');
    $(id).value = opts.some(o => o[0] === cur) ? cur : '';
  };
  fill('fArme', 'Toutes les armes', ARMES.map(a => [a, a]), S.f.arme);
  fill('fAnnee', 'Toutes les années (cumul)', years.map(y => [y, y]), S.f.annee);
  fill('fNiveau', 'Tous les niveaux', NIVEAUX.map(n => [n, n]), S.f.niveau);
  fill('fSujet', 'Tous', subj.map(([k, r]) => [k, r.nom + (r.type === 'equipe' ? ' (équipe)' : '')]), S.f.sujet);
  S.f.arme = $('fArme').value; S.f.annee = $('fAnnee').value; S.f.niveau = $('fNiveau').value; S.f.sujet = $('fSujet').value;
  $('dlNoms').innerHTML = subj.map(([k, r]) => `<option value="${esc(r.nom)}">`).join('');
}
function filtered() {
  return S.data.filter(r =>
    (!S.f.arme || r.arme === S.f.arme) &&
    (!S.f.annee || r.date.slice(0, 4) === S.f.annee) &&
    (!S.f.niveau || r.niveau === S.f.niveau) &&
    (!S.f.sujet || kOf(r) === S.f.sujet));
}
function sorted(rows) {
  const { key, dir } = S.sort;
  const val = r => key === 'niveau' ? NIVEAUX.indexOf(r.niveau) : key === 'place' ? Number(r.place) : String(r[key] || '');
  return rows.slice().sort((a, b) => {
    const x = val(a), y = val(b);
    let c = typeof x === 'number' ? x - y : x.localeCompare(y, 'fr');
    if (c === 0) c = b.date.localeCompare(a.date);
    return key === 'date' ? dir * a.date.localeCompare(b.date) || 0 : c * dir || b.date.localeCompare(a.date);
  });
}
function syncSort() {
  const v = S.sort.key + ':' + S.sort.dir;
  $('fTri').value = [...$('fTri').options].some(o => o.value === v) ? v : '';
}

/* ---------- affichage ---------- */
function medals(rows) {
  return { g: rows.filter(r => +r.place === 1).length, s: rows.filter(r => +r.place === 2).length, b: rows.filter(r => +r.place === 3).length };
}
function render() {
  const rows = filtered(), m = medals(rows);
  $('kpis').innerHTML =
    `<div class="kpi"><b>${rows.length}</b><span>Résultats</span></div>` +
    `<div class="kpi"><b>${m.g}</b><span>🥇 Or</span></div>` +
    `<div class="kpi"><b>${m.s}</b><span>🥈 Argent</span></div>` +
    `<div class="kpi"><b>${m.b}</b><span>🥉 Bronze</span></div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('btnAdd').hidden = !S.edit;
  $('btnEdit').textContent = S.edit ? '🔓 Quitter l\'édition' : '🔒 Mode édition';
  if (!rows.length) { $('view').innerHTML = '<div class="empty">Aucun résultat pour cette sélection.</div>'; return; }
  if (S.tab === 'detail') $('view').innerHTML = viewDetail(rows);
  else if (S.tab === 'tireurs') $('view').innerHTML = viewTireurs(rows);
  else $('view').innerHTML = viewClub(rows);
}

function viewDetail(rows) {
  rows = sorted(rows);
  const cols = S.edit ? 8 : 7;
  const th = (k, l) => `<th class="s" data-sort="${k}">${l}${S.sort.key === k ? (S.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  let h = `<div class="card"><table class="stack"><thead><tr><th></th>${th('date', 'Date')}${th('nom', 'Tireur / équipe')}${th('arme', 'Arme')}<th>Compétition</th><th>Lieu</th>${th('niveau', 'Niveau')}${th('place', 'Place')}${S.edit ? '<th></th>' : ''}</tr></thead><tbody>`;
  let ly = null;
  rows.forEach(r => {
    if (S.sort.key === 'date' && !S.f.annee) {
      const y = r.date.slice(0, 4);
      if (y !== ly) { h += `<tr class="yr"><td colspan="${cols + 1}">${y}</td></tr>`; ly = y; }
    }
    h += `<tr>
      <td class="main">${avatar(r)}<span class="mobname"></span></td>
      <td data-label="Date">${fmtDate(r.date)}</td>
      <td data-label="Tireur / équipe"><span class="nm">${esc(r.nom)}</span>
        <span class="tag">${esc(SEXE_PL[r.sexe] ? r.sexe : '')}</span>${r.type === 'equipe' ? '<span class="tag">Équipe</span>' : ''}${r.categorie ? `<span class="tag">${esc(r.categorie)}</span>` : ''}
        ${r.membres ? `<span class="mem">${esc(r.membres)}</span>` : ''}</td>
      <td data-label="Arme">${esc(r.arme)}</td>
      <td data-label="Compétition">${esc(r.competition)}</td>
      <td data-label="Lieu">${esc(r.lieu)}</td>
      <td data-label="Niveau">${esc(r.niveau)}</td>
      <td data-label="Place" class="place">${placeLabel(r.place)}</td>
      ${S.edit ? `<td data-label=""><button class="btn ghost small" data-act="edit" data-id="${r.id}">✏️</button> <button class="btn ghost small" data-act="del" data-id="${r.id}">🗑️</button></td>` : ''}
    </tr>`;
  });
  return h + '</tbody></table></div>';
}

function viewTireurs(rows) {
  const g = new Map();
  rows.forEach(r => { const k = kOf(r); if (!g.has(k)) g.set(k, []); g.get(k).push(r); });
  const list = [...g.entries()].map(([k, rs]) => {
    const m = medals(rs), best = Math.max(...rs.map(r => NIVEAUX.indexOf(r.niveau)));
    const last = rs.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
    return { k, rs, m, best, last };
  }).sort((a, b) => b.m.g - a.m.g || b.m.s - a.m.s || b.m.b - a.m.b || b.rs.length - a.rs.length || a.last.nom.localeCompare(b.last.nom, 'fr'));
  return '<div class="grid">' + list.map(x => {
    const r = x.last, p = photoFor(x.k);
    const img = p ? `<img class="big" style="display:block" src="${esc(thumb(p, 220, 220))}" alt="${esc(r.nom)}" loading="lazy">` : `<div class="big">${esc(initials(r.nom))}</div>`;
    return `<div class="card pc" data-act="focus" data-key="${esc(x.k)}">
      ${img}<h3>${esc(r.nom)}</h3>
      <div><span class="tag">${r.type === 'equipe' ? 'Équipe' : 'Individuel'}</span><span class="tag">${esc(r.sexe)}</span></div>
      <div class="med">🥇 ${x.m.g} &nbsp; 🥈 ${x.m.s} &nbsp; 🥉 ${x.m.b}</div>
      <div class="small">${x.rs.length} résultat${x.rs.length > 1 ? 's' : ''} · meilleur niveau : ${NIVEAUX[x.best]}</div>
      <div class="small">Dernier : ${fmtDate(r.date)} – ${esc(r.competition)}</div>
    </div>`;
  }).join('') + '</div>';
}

function viewClub(rows) {
  let h = '<div class="card"><table><thead><tr><th>Niveau</th><th>Sexe</th><th class="num">Résultats</th><th class="num">🥇</th><th class="num">🥈</th><th class="num">🥉</th><th class="num">Médailles</th></tr></thead><tbody>';
  NIVEAUX.slice().reverse().forEach(n => {
    SEXES.forEach(s => {
      const rs = rows.filter(r => r.niveau === n && r.sexe === s);
      if (!rs.length) return;
      const m = medals(rs);
      h += `<tr><td>${n}</td><td>${SEXE_PL[s]}</td><td class="num">${rs.length}</td><td class="num">${m.g}</td><td class="num">${m.s}</td><td class="num">${m.b}</td><td class="num"><b>${m.g + m.s + m.b}</b></td></tr>`;
    });
  });
  const t = medals(rows);
  return h + `</tbody><tfoot><tr><td colspan="2">Total club</td><td class="num">${rows.length}</td><td class="num">${t.g}</td><td class="num">${t.s}</td><td class="num">${t.b}</td><td class="num">${t.g + t.s + t.b}</td></tr></tfoot></table></div>`;
}

/* ---------- formulaire ---------- */
function setType(t) {
  document.querySelectorAll('#segType label').forEach(l => l.classList.toggle('on', l.querySelector('input').value === t));
  document.querySelector(`#segType input[value="${t}"]`).checked = true;
  $('lblNom').textContent = t === 'equipe' ? "Nom de l'équipe" : 'Nom du tireur / de la tireuse';
  $('gMembres').hidden = t !== 'equipe';
  const sel = $('mSexe'), cur = sel.value;
  const opts = t === 'equipe' ? SEXES : ['Femme', 'Homme'];
  sel.innerHTML = opts.map(s => `<option value="${s}">${t === 'equipe' ? SEXE_PL[s] : s}</option>`).join('');
  if (opts.includes(cur)) sel.value = cur;
}
function setPhoto(u) {
  S.photo = u || '';
  $('mPrev').hidden = !u; $('mRmPhoto').hidden = !u;
  if (u) $('mPrev').src = thumb(u, 140, 140);
}
function openForm(id) {
  S.editId = id || null;
  const r = id ? S.data.find(x => x.id === id) : null;
  $('mTitle').textContent = r ? 'Modifier le résultat' : 'Ajouter un résultat';
  $('mArme').innerHTML = ARMES.map(a => `<option>${a}</option>`).join('');
  $('mNiveau').innerHTML = NIVEAUX.map(a => `<option>${a}</option>`).join('');
  setType(r ? r.type : 'individuel');
  $('mNom').value = r ? r.nom : '';
  $('mMembres').value = r ? (r.membres || '') : '';
  if (r) $('mSexe').value = r.sexe;
  $('mArme').value = r ? r.arme : ARMES[0];
  $('mNiveau').value = r ? r.niveau : NIVEAUX[0];
  $('mDate').value = r ? r.date : new Date().toISOString().slice(0, 10);
  $('mPlace').value = r ? r.place : '';
  $('mComp').value = r ? r.competition : '';
  $('mLieu').value = r ? r.lieu : '';
  $('mCat').value = r ? (r.categorie || '') : '';
  $('mFile').value = '';
  $('mFileMsg').textContent = "Si aucune photo n'est ajoutée, la photo déjà enregistrée pour ce nom est reprise.";
  setPhoto(r ? r.photo : '');
  $('modal').hidden = false;
}
function resize(file, max) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.85);
    };
    img.onerror = () => rej(new Error('img'));
    img.src = u;
  });
}
async function uploadPhoto(file) {
  const blob = await resize(file, 900);
  const fd = new FormData();
  fd.append('file', blob, 'photo.jpg');
  fd.append('upload_preset', PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`, { method: 'POST', body: fd });
  if (!r.ok) throw new Error('upload');
  return (await r.json()).secure_url;
}

/* ---------- événements ---------- */
['fArme', 'fAnnee', 'fNiveau', 'fSujet'].forEach(id => $(id).addEventListener('change', () => {
  S.f = { arme: $('fArme').value, annee: $('fAnnee').value, niveau: $('fNiveau').value, sujet: $('fSujet').value };
  render();
}));
$('fTri').addEventListener('change', e => { const [k, d] = e.target.value.split(':'); S.sort = { key: k, dir: +d }; render(); });
$('fReset').addEventListener('click', () => {
  S.f = { arme: '', annee: '', niveau: '', sujet: '' };
  ['fArme', 'fAnnee', 'fNiveau', 'fSujet'].forEach(id => $(id).value = '');
  S.sort = { key: 'date', dir: -1 }; syncSort(); render();
});
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) { S.tab = b.dataset.tab; render(); }
});
$('view').addEventListener('click', async e => {
  const th = e.target.closest('[data-sort]');
  if (th) {
    const k = th.dataset.sort;
    S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: (k === 'date' || k === 'niveau') ? -1 : 1 };
    syncSort(); render(); return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'focus') {
    S.f.sujet = a.dataset.key; $('fSujet').value = S.f.sujet; S.tab = 'detail'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (a.dataset.act === 'edit') openForm(a.dataset.id);
  else if (a.dataset.act === 'del') {
    if (!confirm('Supprimer définitivement ce résultat ?')) return;
    try { await fb('DELETE', '/' + a.dataset.id); toast('Résultat supprimé'); await load(); }
    catch (err) { toast('⚠️ Échec de la suppression'); }
  }
});
$('btnEdit').addEventListener('click', () => {
  if (S.edit) { S.edit = false; try { sessionStorage.removeItem('palmEdit'); } catch (e) {} render(); return; }
  const c = prompt("Code d'édition :");
  if (c === null) return;
  if (c === EDIT_CODE) { S.edit = true; try { sessionStorage.setItem('palmEdit', '1'); } catch (e) {} render(); }
  else toast('Code incorrect');
});
$('btnAdd').addEventListener('click', () => openForm());
$('mCancel').addEventListener('click', () => $('modal').hidden = true);
document.querySelectorAll('#segType input').forEach(i => i.addEventListener('change', () => setType(i.value)));
$('mRmPhoto').addEventListener('click', () => { setPhoto(''); $('mFile').value = ''; });
$('mFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('mFileMsg').textContent = '⏳ Envoi de la photo…'; $('mSave').disabled = true;
  try { setPhoto(await uploadPhoto(f)); $('mFileMsg').textContent = '✅ Photo ajoutée'; }
  catch (err) { $('mFileMsg').textContent = "⚠️ Échec de l'envoi de la photo, réessayez."; }
  $('mSave').disabled = false;
});
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const type = document.querySelector('#segType input:checked').value;
  const r = {
    type, nom: $('mNom').value.trim(), sexe: $('mSexe').value, arme: $('mArme').value,
    date: $('mDate').value, lieu: $('mLieu').value.trim(), competition: $('mComp').value.trim(),
    niveau: $('mNiveau').value, place: parseInt($('mPlace').value, 10),
    categorie: $('mCat').value.trim(), membres: type === 'equipe' ? $('mMembres').value.trim() : '',
    photo: S.photo
  };
  if (!r.photo) r.photo = photoFor(kOf(r)) || '';
  $('mSave').disabled = true;
  try {
    if (S.editId) await fb('PUT', '/' + S.editId, r); else await fb('POST', '', r);
    $('modal').hidden = true; toast('✅ Résultat enregistré'); await load();
  } catch (err) { toast("⚠️ Échec de l'enregistrement"); }
  $('mSave').disabled = false;
});

try { if (sessionStorage.getItem('palmEdit')) S.edit = true; } catch (e) {}
syncSort();
load();
</script>
</body>
</html>
